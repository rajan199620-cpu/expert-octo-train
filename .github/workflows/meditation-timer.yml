name: Meditation Timer APK

on:
  push:
    paths:
      - "meditation-timer/**"
      - ".github/workflows/meditation-timer.yml"
  pull_request:
    paths:
      - "meditation-timer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK and commit screenshots
    defaults:
      run:
        working-directory: meditation-timer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Logic, randomised stress and Robolectric tests (real service, storage, reminder,
      # widget and screens, with screenshots).
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meditation-test-report
          path: meditation-timer/app/build/reports/tests/testDebugUnitTest
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No private signing key: using the committed test key (meditation-timer/app/meditation-debug.keystore)."
          fi
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      # Google sign-in is registered against this certificate; a different one breaks sign-in.
      - name: Check the APK is signed with the fixed key
        if: env.SIGNING_KEYSTORE_PATH == ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          digest=$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signing certificate SHA-256: $digest"
          test "$digest" = "003742e471aea573ca5f75c12f4780f154322e47a16461cf1b7e2f753acaa9d7"
      - uses: actions/upload-artifact@v4
        with:
          name: meditation-timer-apk
          path: meditation-timer/app/build/outputs/apk/release/*.apk
      # Two pushes in quick succession run side by side, and the older one can finish last.
      # Only the run for the newest code publishes and commits screenshots, so the download
      # link never goes back to an older build. Screenshot-only commits ([skip ci]) don't count.
      - name: Is this still the newest code on the branch?
        id: newest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer=$(gh api "repos/${{ github.repository }}/compare/${GITHUB_SHA}...${{ github.ref_name }}" \
            --jq '[.commits[] | select(.commit.message | contains("[skip ci]") | not)] | length' || echo 0)
          echo "Code commits pushed after this one: $newer"
          if [ "$newer" = "0" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; fi
      # Artifact links expire in minutes; a release asset has a stable URL that always serves
      # the newest build: https://github.com/<repo>/releases/download/apk/meditation-timer.apk
      - name: Publish to the permanent download link
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/meditation-timer.apk"
          notes="Build $GITHUB_RUN_NUMBER from ${GITHUB_SHA::7}. This link always serves the newest build."
          if gh release view apk >/dev/null 2>&1; then
            gh release edit apk --notes "$notes"
          else
            gh release create apk --target "$GITHUB_SHA" --title "Meditation Timer: latest APK" --notes "$notes"
          fi
          gh release upload apk "$RUNNER_TEMP/meditation-timer.apk" --clobber
      - name: Commit screenshots
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        run: |
          mkdir -p docs/screenshots
          cp app/build/outputs/roborazzi/*.png docs/screenshots/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update meditation timer screenshots [skip ci]"
            # Screenshots are a record, not the build: another run's set landing first is fine.
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              git rebase --abort
              echo "Another run committed screenshots first; keeping those."
              exit 0
            fi
            git push origin HEAD:"${{ github.ref_name }}" || echo "The branch moved on; its own run will commit screenshots."
          fi
