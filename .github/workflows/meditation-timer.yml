name: Meditation Timer APK

on:
  push:
    paths:
      - "meditation-timer/**"
      - ".github/workflows/meditation-timer.yml"
  pull_request:
    paths:
      - "meditation-timer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meditation-timer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: meditation-timer-apk
          path: meditation-timer/app/build/outputs/apk/release/*.apk
