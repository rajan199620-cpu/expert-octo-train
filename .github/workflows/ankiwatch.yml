name: AnkiWatch

on:
  push:
    paths:
      - "ankiwatch/**"
      - ".github/workflows/ankiwatch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankiwatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs + unit/stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ankiwatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One key signs both APKs (the Data Layer only pairs apps with the same signature).
      # With the repository secrets set, every build uses your stable key, so updates
      # install over the previous version. Without them, each run makes a one-off key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANKIWATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANKIWATCH_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ankiwatch.p12"
            {
              echo "storeFile=$RUNNER_TEMP/ankiwatch.p12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=ankiwatch"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "::notice::Signed with the stable AnkiWatch key from repository secrets."
          else
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning::No signing secrets set: this build uses a one-off key. The install scripts uninstall the previous build first when the key changed."
          fi

      - name: Unit and stress tests
        run: ./gradlew --no-daemon --stacktrace :core:test :mobile:testReleaseUnitTest :wear:testReleaseUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace :mobile:assembleRelease :wear:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/release/mobile-release.apk dist/ankiwatch-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/ankiwatch-watch.apk
          cp install/install.ps1 install/install.sh dist/
          (cd dist && sha256sum ankiwatch-phone.apk ankiwatch-watch.apk > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ankiwatch-apks
          path: ankiwatch/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: ankiwatch/**/build/reports/tests/

  wear-ui:
    name: Watch UI tests (Wear OS emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./ankiwatch/gradlew -p ankiwatch --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest

      # Each script line runs on its own; the last line fails the step if the tests did,
      # after screenshots and logs have been saved.
      - name: Run on a Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            ./ankiwatch/gradlew -p ankiwatch --no-daemon :wear:connectedDebugAndroidTest || touch wear-ui-failed
            adb logcat -d -v raw -s ANKIWATCH_SHOT:I > wear-shots.log || true
            adb logcat -d -s AnkiWatchTest:I TestRunner:I AndroidRuntime:E > wear-logcat.log || true
            test ! -f wear-ui-failed

      - name: Screenshots
        if: always()
        run: |
          cat wear-logcat.log || true
          python3 .github/scripts/collect_screenshots.py wear-shots.log screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-ui-results
          path: |
            screenshots/
            wear-logcat.log
            ankiwatch/wear/build/reports/androidTests/
            ankiwatch/wear/build/outputs/androidTest-results/

  phone-ankidroid:
    name: Phone tests against real AnkiDroid (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the latest AnkiDroid release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo ankidroid/Anki-Android --json tagName --jq .tagName)
          echo "AnkiDroid release: $tag"
          gh release view "$tag" --repo ankidroid/Anki-Android --json assets --jq '.assets[].name'
          asset=$(gh release view "$tag" --repo ankidroid/Anki-Android --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))] | (map(select(test("x86_64") and test("full"))) + map(select(test("x86_64"))) + map(select(test("universal")))) | .[0] // empty')
          if [ -z "$asset" ]; then echo "::error::No emulator-compatible AnkiDroid APK in $tag"; exit 1; fi
          echo "Using $asset"
          gh release download "$tag" --repo ankidroid/Anki-Android --pattern "$asset" --output ankidroid.apk
          ls -la ankidroid.apk

      - name: Build app and test APKs
        run: ./ankiwatch/gradlew -p ankiwatch --no-daemon :mobile:assembleDebug :mobile:assembleDebugAndroidTest

      - name: Run on a phone emulator with AnkiDroid
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ankidroid.apk
            ./ankiwatch/gradlew -p ankiwatch --no-daemon :mobile:connectedDebugAndroidTest || touch phone-failed
            adb logcat -d -s AnkiWatchIT:* AnkiDroidHelper:* TestRunner:I AndroidRuntime:E > phone-logcat.log || true
            test ! -f phone-failed

      - name: Logs
        if: always()
        run: cat phone-logcat.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-ankidroid-results
          path: |
            phone-logcat.log
            ankiwatch/mobile/build/reports/androidTests/
            ankiwatch/mobile/build/outputs/androidTest-results/
