name: Earmark (audiobook app)

on:
  push:
    paths:
      - "audiobook-app/**"
      - ".github/workflows/audiobook-app.yml"
  pull_request:
    paths:
      - "audiobook-app/**"
      - ".github/workflows/audiobook-app.yml"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audiobook-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew -Pearmark.coreOnly=true :core:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: audiobook-app/core/build/reports/tests/test

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audiobook-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Check the APK is signed with the fixed key (so it installs as an update)
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          digest=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signing certificate SHA-256: $digest"
          test "$digest" = "3caa9f2095d0ff8f1061751ce392b8d48aa33a32ed034d2b15c33ff7bb2da85b"
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: earmark-debug-apk
          path: audiobook-app/app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: audiobook-app/app/build/reports/lint-results-debug.html

  screenshots:
    name: UI screenshots (Robolectric + Roborazzi)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: audiobook-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: App unit tests and screens
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: audiobook-app/app/build/reports/tests/testDebugUnitTest
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: audiobook-app/app/build/outputs/roborazzi
      - name: Commit screenshots to the branch
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots
          cp app/build/outputs/roborazzi/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update UI screenshots [skip ci]"
            git push
          fi
