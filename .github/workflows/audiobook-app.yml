name: Earmark (audiobook app)

on:
  push:
    paths:
      - "audiobook-app/**"
      - ".github/workflows/audiobook-app.yml"
  pull_request:
    paths:
      - "audiobook-app/**"
      - ".github/workflows/audiobook-app.yml"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audiobook-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew -Pearmark.coreOnly=true :core:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: audiobook-app/core/build/reports/tests/test

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audiobook-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: earmark-debug-apk
          path: audiobook-app/app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: audiobook-app/app/build/reports/lint-results-debug.html
