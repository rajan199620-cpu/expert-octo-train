name: Mindfield APK

on:
  push:
    paths:
      - "mindfield/**"
      - ".github/workflows/mindfield.yml"
  pull_request:
    paths:
      - "mindfield/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK and commit screenshots
    defaults:
      run:
        working-directory: mindfield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Content checks, randomised stress tests and Robolectric tests (real notifications, alarms,
      # widget and screens, with screenshots).
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      # A short list of what failed and where, at the end of the log where it's easy to find.
      - name: Summarise test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="([^"]*)" classname="([^"]*)"[^>]*>\s*<failure message="([^"]*)"[^>]*>([^<]*)', s):
                  print('FAILED', m.group(2).split('.')[-1], '>', html.unescape(m.group(1)))
                  print('    ', html.unescape(m.group(3))[:600].replace('\n', ' | '))
                  for line in [l.strip() for l in html.unescape(m.group(4)).splitlines() if 'com.rajan' in l][:5]:
                      print('        ', line)
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindfield-test-report
          path: mindfield/app/build/reports/tests/testDebugUnitTest
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MINDFIELD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No private signing key: using the committed test key (mindfield/app/mindfield-debug.keystore)."
          fi
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.MINDFIELD_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      # Google sign-in is registered against this certificate; a different one breaks sign-in.
      - name: Check the APK is signed with the fixed key
        if: env.SIGNING_KEYSTORE_PATH == ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          digest=$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signing certificate SHA-256: $digest"
          test "$digest" = "003742e471aea573ca5f75c12f4780f154322e47a16461cf1b7e2f753acaa9d7"
      - uses: actions/upload-artifact@v4
        with:
          name: mindfield-apk
          path: mindfield/app/build/outputs/apk/release/*.apk
      # Artifact links expire; a release asset has a stable URL that always serves the newest
      # build: https://github.com/<repo>/releases/download/mindfield-apk/mindfield.apk
      - name: Publish to the permanent download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/mindfield.apk"
          notes="Build $GITHUB_RUN_NUMBER from ${GITHUB_SHA::7}. This link always serves the newest build."
          if gh release view mindfield-apk >/dev/null 2>&1; then
            gh release edit mindfield-apk --notes "$notes"
          else
            gh release create mindfield-apk --target "$GITHUB_SHA" --title "Mindfield: latest APK" --notes "$notes"
          fi
          gh release upload mindfield-apk "$RUNNER_TEMP/mindfield.apk" --clobber
      - name: Commit screenshots
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp app/build/outputs/roborazzi/*.png docs/screenshots/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update Mindfield screenshots [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
