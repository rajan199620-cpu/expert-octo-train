<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="wrap"></div>
<script>
// Shape of an Anki editor field: a contenteditable inside a shadow root.
class AnkiEditable extends HTMLElement {
  constructor(){ super(); const r = this.attachShadow({mode:"open"});
    const d = document.createElement("div");
    d.setAttribute("contenteditable","true");
    d.className = "rich-text-editable";
    d.style.cssText = "min-height:2em;border:1px solid #888;padding:4px;font:16px sans-serif";
    r.appendChild(d); this.editable = d; }
}
customElements.define("anki-editable", AnkiEditable);
window.mkField = function(html){
  const host = document.createElement("anki-editable");
  document.getElementById("wrap").appendChild(host);
  host.editable.innerHTML = html;
  return host;
};
</script>
</body></html>
